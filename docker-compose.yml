version: '3.8'

services:
  bocs-postgres:
    image: postgres:16-alpine
    container_name: bocs-postgres
    restart: always
    environment:
      POSTGRES_USER: bocs_admin
      POSTGRES_PASSWORD: bocs_secure_password_2026
      POSTGRES_DB: bocs_db
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bocs_admin -d bocs_db"]
      interval: 5s
      timeout: 5s
      retries: 5
