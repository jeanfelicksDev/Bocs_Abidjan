<!DOCTYPE html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOCS Maritime — Plateforme de Gestion Import, Export & Facturation</title>
    <!-- Polices et icônes embarquées : voir src/styles/fonts.ts (aucun appel externe). -->

    <!-- Application installable (PC et téléphone) : manifeste, icônes, couleur de la barre
         de titre. Icônes produites par scripts/generate-app-icons.mjs. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BOCS" />

    <script>
      // Même règle que src/utils/theme.ts : choix mémorisé (eglin, bocs ou night ;
      // les anciens "dark" et "light" valaient Eglin et bleu BOCS), sinon réglage du poste.
      (function () {
        var t = localStorage.getItem("theme");
        var theme =
          t === "eglin" || t === "bocs" || t === "night" ? t
          : t === "dark" ? "eglin"
          : t === "light" ? "bocs"
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "bocs";
        var classes = document.documentElement.classList;
        classes.toggle("dark", theme !== "bocs");
        classes.toggle("night", theme === "night");
        classes.toggle("light", theme === "bocs");
        // Barre de titre de l'application installée : la couleur de l'en-tête du thème.
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute("content", theme === "night" ? "#111714" : "#ffffff");
      })();
    </script>
  </head>
  <body class="bg-[var(--deck-ground)] text-[var(--ink)] font-sans antialiased relative min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
