<!DOCTYPE html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOCS Maritime — Plateforme de Gestion Import, Export & Facturation</title>
    <!-- Polices et icônes embarquées : voir src/styles/fonts.ts (aucun appel externe). -->
  
    <script>
      // Même règle que src/utils/theme.ts : choix mémorisé, sinon réglage du système.
      (function () {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", !dark);
      })();
    </script>
  </head>
  <body class="bg-[var(--deck-ground)] text-[var(--ink)] font-sans antialiased relative min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
